name: onduidelijkheden

on:
  push:
  schedule:
    # Elke maandagochtend, zodat een ticket dat in de week ervoor is gesloten meteen opvalt.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Het script roept `gh issue list` aan, dus het token heeft leesrechten op issues nodig. Een
    # permissions-blok is uitputtend: alles wat er niet in staat wordt none, dus contents moet er
    # ook bij, anders kan actions/checkout zich niet meer authenticeren.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-uncertainties.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
