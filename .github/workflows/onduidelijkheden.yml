name: onduidelijkheden

on:
  push:
  schedule:
    # Elke maandagochtend, zodat een ticket dat in de week ervoor is gesloten meteen opvalt.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Het script roept `gh issue list` aan, en de repo geeft workflows standaard alleen leesrechten
    # op contents. Dit werkt nu alleen omdat de repo publiek is; zonder dit blok breekt het zodra
    # de repo privaat wordt.
    permissions:
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check-uncertainties.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
